name: ci

on:
  push:
  pull_request:

jobs:
  python-versions:
    name: Python ${{ matrix.python }} / Linux
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          CLAUDIO_HOME: ${{ runner.temp }}/claudio

  cross-platform:
    name: ${{ matrix.os }} / Python 3.11
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          CLAUDIO_HOME: ${{ runner.temp }}/claudio

  quality-and-render:
    name: Schema, lint, browser, render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt ruff "setuptools>=68" wheel
      - run: python -m compileall -q .
      - run: ruff check --select E9,F63,F7,F82 .
      - run: python cli.py preset validate --all
        env:
          CLAUDIO_HOME: ${{ runner.temp }}/claudio
      - name: Build and import the isolated tool package
        run: python -m pip install --no-deps --no-build-isolation --target "${{ runner.temp }}/package" .
      - name: Verify packaged runtime assets
        run: python -c "from pathlib import Path; import claudio_symphony, claudio_symphony.cli as c; root=Path(claudio_symphony.__file__).parent; assert c.entrypoint; assert (root/'web/app.js').is_file(); assert len(list((root/'presets').glob('*/preset.json'))) == 40"
        env:
          PYTHONPATH: ${{ runner.temp }}/package
          CLAUDIO_HOME: ${{ runner.temp }}/package-home
      - run: node --check web/app.js
      - name: Render one complete preset outside the checkout
        run: python presets/meadow/render.py
        env:
          CLAUDIO_HOME: ${{ runner.temp }}/claudio
          CLAUDIO_SAMPLES_DIR: ${{ runner.temp }}/render-smoke
          CLAUDIO_PRESET_CONFIG: presets/meadow/preset.json
      - name: Confirm renderer produced WAV files
        shell: bash
        run: test "$(find '${{ runner.temp }}/render-smoke' -name '*.wav' | wc -l)" -gt 0

  posix-ism-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No process POSIX-isms outside audio.py
        run: |
          if grep -nE '/usr/bin/afplay|/bin/sh|pkill|start_new_session|/usr/bin/open|/usr/bin/env|os\.execvp|os\.kill' \
               event.py cli.py drone.py webui.py tune.py | grep -vE '^[^:]+:[0-9]+:#!'; then
            echo "::error::A macOS/POSIX-only primitive leaked outside audio.py (see matches above)."
            exit 1
          fi
          echo "clean: playback/process primitives are confined to audio.py"
